name: CI

on:
  push:
    branches: [main, glm-4.7-flash]
  pull_request:
    branches: [main, glm-4.7-flash]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        working-directory: ./apps/customer-web
      - name: Lint Agent App
        run: npm run lint
        working-directory: ./apps/agent-web
      - name: Lint Admin Panel
        run: npm run lint
        working-directory: ./apps/admin-panel

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer-web, agent-web, admin-panel]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test
        working-directory: ./apps/${{ matrix.app }}

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        app: [customer-web, agent-web, admin-panel]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        working-directory: ./apps/${{ matrix.app }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-${{ matrix.app }}
          path: ./apps/${{ matrix.app }}/.next
          retention-days: 7