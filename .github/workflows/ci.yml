name: CI

on:
  push:
    branches: [main, glm-4.7-flash]
  pull_request:
    branches: [main, glm-4.7-flash]

defaults:
  run:
    working-directory: glm-4.7-flash

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: glm-4.7-flash/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Turbo runs each task across all workspaces
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
